[project]
name = "searchagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "huuhgodona", email = "3152286113@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aisuite>=0.2.0",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "ipython>=8.39.0",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.51.0",
    "pillow>=12.3.0",
    "pygraphviz>=2.0.4",
]

[project.scripts]
searchagent = "searchagent.main:main"
searchagent-test = "searchagent.main:test"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
